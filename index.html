<!doctype html>

<!-- that is create by Het Viradiya -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>Hello</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --accent: #6366f1;
        --mine: #4f46e5;
        --theirs: #334155;
        --danger: #ef4444;
        --success: #10b981;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg);
        color: var(--text);
      }
      body {
        display: flex;
        justify-content: center;
        position: fixed;
        inset: 0;
      }
      #app {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        height: 100%;
        position: relative;
      }

      /* Auth Containers */
      .auth-card {
        margin: auto;
        padding: 24px;
        background: var(--card);
        border-radius: 12px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
      }
      h2 {
        margin-bottom: 12px;
        font-size: 1.2rem;
        text-align: center;
      }
      .tab-group {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .tab-btn {
        flex: 1;
        background: #334155;
        padding: 8px;
        font-size: 0.9rem;
        border-radius: 6px;
        border: none;
        color: white;
        cursor: pointer;
      }
      .tab-btn.active {
        background: var(--accent);
      }
      .section-label {
        font-size: 0.8rem;
        font-weight: bold;
        color: var(--accent);
        margin-top: 10px;
        margin-bottom: 4px;
        display: block;
      }
      input, select, button {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #0f172a;
        color: white;
        font-size: 1rem;
      }
      button.primary-btn {
        background: var(--accent);
        border: none;
        font-weight: bold;
        cursor: pointer;
        margin-top: 6px;
      }
      button.primary-btn:active { opacity: 0.9; }

      /* Chat Screen */
      #chat-screen {
        display: none;
        flex-direction: column;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      header {
        padding: 12px 16px;
        background: var(--card);
        border-bottom: 1px solid #334155;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        z-index: 10;
      }
      .header-actions {
        display: flex;
        gap: 8px;
      }
      .btn-sm {
        width: auto !important;
        padding: 6px 12px !important;
        font-size: 0.8rem !important;
        margin: 0 !important;
        border-radius: 6px !important;
      }
      .btn-danger { background: var(--danger) !important; color: white !important; }
      .btn-gray { background: #475569 !important; color: white !important; }

      #chat-box {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 82%;
        padding: 10px 14px;
        border-radius: 14px;
        word-break: break-word;
        font-size: 0.95rem;
      }
      .msg.mine {
        align-self: flex-end;
        background: var(--mine);
        border-bottom-right-radius: 2px;
      }
      .msg.theirs {
        align-self: flex-start;
        background: var(--theirs);
        border-bottom-left-radius: 2px;
      }
      .msg-img {
        max-width: 100%;
        max-height: 220px;
        border-radius: 8px;
        margin-top: 4px;
        display: block;
      }
      .download-btn {
        display: inline-block;
        background: var(--success) !important;
        color: white !important;
        border: none;
        padding: 6px 10px !important;
        border-radius: 6px !important;
        font-size: 0.75rem !important;
        font-weight: bold;
        margin-top: 6px !important;
        cursor: pointer;
        width: auto !important;
      }
      .msg-meta {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }
      .msg-time {
        font-size: 0.7rem;
        opacity: 0.7;
      }
      .del-msg-btn {
        background: #dc2626 !important;
        color: #ffffff !important;
        border: none;
        font-size: 0.7rem !important;
        font-weight: bold;
        cursor: pointer;
        padding: 2px 6px !important;
        border-radius: 4px !important;
        width: auto !important;
        margin: 0 !important;
        display: inline-block !important;
      }

      footer {
        padding: 10px;
        background: var(--card);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        border-top: 1px solid #334155;
      }
      footer input[type="text"] {
        margin: 0;
        flex: 1;
        font-size: 16px;
      }
      footer button {
        width: auto;
        padding: 0 16px;
        margin: 0;
        height: 44px;
      }
      .img-upload-label {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #334155;
        border-radius: 8px;
        width: 44px;
        height: 44px;
        cursor: pointer;
        font-size: 1.2rem;
      }
      #file-input { display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Authentication Hub -->
      <div id="auth-hub" class="auth-card">
        <div class="tab-group">
          <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Login Room</button>
          <button id="tab-create" class="tab-btn" onclick="switchTab('create')">Create New Room</button>
        </div>

        <!-- 1. Join / Login Form -->
        <div id="login-section">
          <h2>Enter Private Room</h2>
          <label style="font-size: 0.8rem; color: #94a3b8">Room Name / ID</label>
          <input type="text" id="login-room-id" placeholder="e.g. room99" />

          <label style="font-size: 0.8rem; color: #94a3b8">Your Role</label>
          <select id="login-role">
            <option value="p1">Partner A</option>
            <option value="p2">Partner B</option>
          </select>

          <label style="font-size: 0.8rem; color: #94a3b8">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" onkeypress="handleLoginEnter(event)" />

          <button class="primary-btn" onclick="handleLogin()">Join Room</button>
        </div>

        <!-- 2. Create Room Form -->
        <div id="create-section" style="display: none;">
          <h2>Create New 2-Person Room</h2>
          <p style="font-size: 0.75rem; color: #94a3b8; text-align: center; margin-bottom: 12px;">
            Set credentials for both partners. Share the Room Name & passwords privately.
          </p>

          <span class="section-label">Unique Room ID</span>
          <input type="text" id="reg-room-id" placeholder="e.g. couple-secret-room" />

          <span class="section-label">Partner A (Your Identity & Password)</span>
          <input type="text" id="reg-p1-name" placeholder="Partner A Name (e.g. Alice)" />
          <input type="password" id="reg-p1-pass" placeholder="Partner A Password" />

          <span class="section-label">Partner B (Her Identity & Password)</span>
          <input type="text" id="reg-p2-name" placeholder="Partner B Name (e.g. Bob)" />
          <input type="password" id="reg-p2-pass" placeholder="Partner B Password" />

          <span class="section-label">Shared Secret Key (Used for E2EE)</span>
          <input type="password" id="reg-secret" placeholder="Shared Secret Passphrase" />

          <button class="primary-btn" onclick="registerNewRoom()">Create Room</button>
        </div>
      </div>

      <!-- Chat Screen -->
      <div id="chat-screen">
        <header>
          <div>
            <strong id="header-user"></strong>
            <span id="header-room" style="font-size: 0.75rem; color: #94a3b8; margin-left: 4px;"></span>
            <span style="font-size: 0.75rem; color: #10b981; margin-left: 6px">● E2EE</span>
          </div>
          <div class="header-actions">
            <button class="btn-sm btn-danger" onclick="clearAllChat()">🗑 Clear</button>
            <button class="btn-sm btn-gray" onclick="location.reload()">Exit</button>
          </div>
        </header>
        <div id="chat-box"></div>
        <footer>
          <label class="img-upload-label" for="file-input" title="Send Image">📷</label>
          <input type="file" id="file-input" accept="image/*" onchange="handleImageUpload(event)" />
          <input
            type="text"
            id="msg-input"
            placeholder="Type a message..."
            onkeypress="handleEnter(event)"
          />
          <button id="send-btn" onclick="sendMessage()">Send</button>
        </footer>
      </div>
    </div>

    <!-- Mobile Viewport Fix -->
    <script>
      function adjustViewport() {
        if (window.visualViewport) {
          const app = document.getElementById("app");
          app.style.height = `${window.visualViewport.height}px`;
          const chatBox = document.getElementById("chat-box");
          if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
        }
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", adjustViewport);
        window.visualViewport.addEventListener("scroll", adjustViewport);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const msgInput = document.getElementById("msg-input");
        if (msgInput) {
          msgInput.addEventListener("focus", () => {
            setTimeout(() => {
              adjustViewport();
              const chatBox = document.getElementById("chat-box");
              if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
            }, 300);
          });
        }
      });

      function switchTab(tab) {
        document.getElementById("login-section").style.display = tab === "login" ? "block" : "none";
        document.getElementById("create-section").style.display = tab === "create" ? "block" : "none";
        document.getElementById("tab-login").className = `tab-btn ${tab === "login" ? "active" : ""}`;
        document.getElementById("tab-create").className = `tab-btn ${tab === "create" ? "active" : ""}`;
      }
    </script>

    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        deleteDoc,
        doc,
        getDoc,
        setDoc,
        getDocs,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCOJGU8KaKbUrHzzDkH_8sVoiy2spofrmM",
        authDomain: "chating-a20e0.firebaseapp.com",
        projectId: "chating-a20e0",
        storageBucket: "chating-a20e0.firebasestorage.app",
        messagingSenderId: "314695357052",
        appId: "1:314695357052:web:cfb63a5dcb19fa4c7e2ff9",
        measurementId: "G-TFZW77YFWF",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      let currentRoomId = "";
      let currentUser = "";
      let cryptoKey = null;
      let isInitialLoad = true;

      const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;
      const FOUR_MONTHS_MS = 120 * 24 * 60 * 60 * 1000;

      const chimeSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");

      async function deriveKey(passphrase) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          "raw",
          enc.encode(passphrase),
          "PBKDF2",
          false,
          ["deriveKey"],
        );
        const salt = enc.encode("our-custom-chat-salt-2026");
        return window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: 100000,
            hash: "SHA-256",
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"],
        );
      }

      async function encryptRaw(text, key) {
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const cipherBuffer = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          key,
          new TextEncoder().encode(text)
        );
        return {
          ct: btoa(String.fromCharCode(...new Uint8Array(cipherBuffer))),
          iv: btoa(String.fromCharCode(...iv))
        };
      }

      async function decryptRaw(ctBase64, ivBase64, key) {
        const cipherBytes = Uint8Array.from(atob(ctBase64), (c) => c.charCodeAt(0));
        const ivBytes = Uint8Array.from(atob(ivBase64), (c) => c.charCodeAt(0));
        const decryptedBuffer = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: ivBytes },
          key,
          cipherBytes
        );
        return new TextDecoder().decode(decryptedBuffer);
      }

      // 1. Create a New Room with credentials for both users
      window.registerNewRoom = async function () {
        const roomId = document.getElementById("reg-room-id").value.trim().toLowerCase();
        const p1Name = document.getElementById("reg-p1-name").value.trim();
        const p1Pass = document.getElementById("reg-p1-pass").value.trim();
        const p2Name = document.getElementById("reg-p2-name").value.trim();
        const p2Pass = document.getElementById("reg-p2-pass").value.trim();
        const secret = document.getElementById("reg-secret").value.trim();

        if (!roomId || !p1Name || !p1Pass || !p2Name || !p2Pass || !secret) {
          alert("All fields are required.");
          return;
        }

        try {
          // Check if room already exists
          const roomRef = doc(db, "rooms", roomId);
          const roomSnap = await getDoc(roomRef);
          if (roomSnap.exists()) {
            alert("This Room ID already exists. Please choose a different name.");
            return;
          }

          // Encrypt shared secret key with individual passwords
          const key1 = await deriveKey(p1Pass);
          const key2 = await deriveKey(p2Pass);

          const [encSecretP1, encSecretP2] = await Promise.all([
            encryptRaw(secret, key1),
            encryptRaw(secret, key2)
          ]);

          await setDoc(roomRef, {
            p1Name,
            p1Vault: encSecretP1,
            p2Name,
            p2Vault: encSecretP2,
            createdAt: Date.now()
          });

          alert(`Room "${roomId}" created! Now login with your password.`);
          switchTab("login");
          document.getElementById("login-room-id").value = roomId;
        } catch (e) {
          alert("Creation failed: " + e.message);
        }
      };

      // 2. Login to Room
      window.handleLogin = async function () {
        const roomId = document.getElementById("login-room-id").value.trim().toLowerCase();
        const role = document.getElementById("login-role").value;
        const pass = document.getElementById("login-password").value.trim();

        if (!roomId || !pass) {
          alert("Please enter both Room ID and Password.");
          return;
        }

        try {
          const roomRef = doc(db, "rooms", roomId);
          const roomSnap = await getDoc(roomRef);

          if (!roomSnap.exists()) {
            alert("Room not found! Check Room ID or create a new one.");
            return;
          }

          const roomData = roomSnap.data();
          const userKey = await deriveKey(pass);
          const vault = role === "p1" ? roomData.p1Vault : roomData.p2Vault;

          const plainSecret = await decryptRaw(vault.ct, vault.iv, userKey);
          cryptoKey = await deriveKey(plainSecret);
          currentUser = role === "p1" ? roomData.p1Name : roomData.p2Name;
          currentRoomId = roomId;

        } catch (err) {
          alert("Incorrect password or role!");
          return;
        }

        if ("Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
        }

        document.getElementById("auth-hub").style.display = "none";
        document.getElementById("chat-screen").style.display = "flex";
        document.getElementById("header-user").textContent = currentUser;
        document.getElementById("header-room").textContent = `(#${currentRoomId})`;

        adjustViewport();
        runAutoPurge();
        listenToMessages();
      };

      window.handleLoginEnter = function (event) {
        if (event.key === "Enter") window.handleLogin();
      };

      function triggerNotification(sender, isImage) {
        chimeSound.play().catch(() => {});
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification(sender, {
            body: isImage ? "📷 Sent a photo" : "Sent a new message",
            icon: "https://cdn-icons-png.flaticon.com/512/1041/1041916.png",
          });
        }
      }

      async function runAutoPurge() {
        try {
          const now = Date.now();
          const colRef = collection(db, "rooms", currentRoomId, "messages");
          const snapshot = await getDocs(colRef);

          snapshot.forEach(async (docSnap) => {
            const data = docSnap.data();
            const age = now - (data.createdAt || 0);

            if (age > FOUR_MONTHS_MS) {
              await deleteDoc(doc(db, "rooms", currentRoomId, "messages", docSnap.id));
              return;
            }

            if (data.type === "image" && age > THREE_DAYS_MS) {
              await deleteDoc(doc(db, "rooms", currentRoomId, "messages", docSnap.id));
            }
          });
        } catch (e) {
          console.warn("Purge error:", e);
        }
      }

      function listenToMessages() {
        const colRef = collection(db, "rooms", currentRoomId, "messages");
        const chatBox = document.getElementById("chat-box");

        onSnapshot(colRef, async (snapshot) => {
          let messages = [];
          snapshot.forEach((docSnap) => {
            messages.push({ id: docSnap.id, ...docSnap.data() });
          });

          messages.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

          chatBox.innerHTML = "";
          for (const data of messages) {
            let plainText = "";
            try {
              plainText = await decryptRaw(data.ciphertext, data.iv, cryptoKey);
            } catch {
              plainText = "[Encrypted Message]";
            }

            const isMine = data.sender === currentUser;
            const msgEl = document.createElement("div");
            msgEl.className = `msg ${isMine ? "mine" : "theirs"}`;

            const timeStr = data.createdAt
              ? new Date(data.createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
              : "just now";

            const deleteActionHtml = isMine
              ? `<button class="del-msg-btn" onclick="deleteSingleMessage('${data.id}')">Delete</button>`
              : "";

            const isImage = data.type === "image" || plainText.startsWith("data:image/");

            let contentHtml = "";
            if (isImage) {
              contentHtml = `
                <img src="${plainText}" class="msg-img" alt="Shared photo" />
                <div>
                  <button class="download-btn" onclick="downloadAndDelete('${data.id}', '${plainText}')">
                    ⬇ Download & Delete
                  </button>
                </div>
              `;
            } else {
              contentHtml = `<div>${escapeHtml(plainText)}</div>`;
            }

            msgEl.innerHTML = `
              ${contentHtml}
              <div class="msg-meta">
                <span class="msg-time">${timeStr}</span>
                ${deleteActionHtml}
              </div>
            `;
            chatBox.appendChild(msgEl);
          }

          chatBox.scrollTop = chatBox.scrollHeight;

          if (!isInitialLoad && snapshot.docChanges().some(c => c.type === "added" && c.doc.data().sender !== currentUser)) {
            const latest = messages[messages.length - 1];
            if (latest && latest.sender !== currentUser) {
              triggerNotification(latest.sender, latest.type === "image");
            }
          }

          isInitialLoad = false;
        });
      }

      window.sendMessage = async function () {
        const input = document.getElementById("msg-input");
        const text = input.value.trim();
        if (!text || !cryptoKey) return;

        input.value = "";
        try {
          const { ct, iv } = await encryptRaw(text, cryptoKey);
          await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
            sender: currentUser,
            type: "text",
            ciphertext: ct,
            iv: iv,
            createdAt: Date.now(),
          });
        } catch (error) {
          alert("Could not send: " + error.message);
        }
      };

      window.handleImageUpload = async function (e) {
        const file = e.target.files[0];
        if (!file || !cryptoKey) return;

        const sendBtn = document.getElementById("send-btn");
        sendBtn.disabled = true;
        sendBtn.textContent = "⏳...";

        try {
          const base64Data = await readImageAsOptimizedDataURL(file);
          const { ct, iv } = await encryptRaw(base64Data, cryptoKey);

          await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
            sender: currentUser,
            type: "image",
            ciphertext: ct,
            iv: iv,
            createdAt: Date.now(),
          });
        } catch (err) {
          alert("Image send failed: " + err.message);
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = "Send";
          e.target.value = "";
        }
      };

      window.downloadAndDelete = async function (docId, base64Url) {
        try {
          const link = document.createElement("a");
          link.href = base64Url;
          link.download = `photo_${Date.now()}.jpg`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          await deleteDoc(doc(db, "rooms", currentRoomId, "messages", docId));
        } catch (err) {
          alert("Download/Delete error: " + err.message);
        }
      };

      function readImageAsOptimizedDataURL(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              const maxDim = 1000;
              let width = img.width;
              let height = img.height;

              if (width > height && width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }

              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              resolve(canvas.toDataURL("image/jpeg", 0.7));
            };
            img.onerror = reject;
          };
          reader.onerror = reject;
        });
      }

      window.deleteSingleMessage = async function (messageId) {
        if (!confirm("Delete this message?")) return;
        try {
          await deleteDoc(doc(db, "rooms", currentRoomId, "messages", messageId));
        } catch (err) {
          alert("Failed to delete: " + err.message);
        }
      };

      window.clearAllChat = async function () {
        if (!confirm("Are you sure you want to delete ALL messages in this room?")) return;
        try {
          const colRef = collection(db, "rooms", currentRoomId, "messages");
          const snapshot = await getDocs(colRef);
          const deletePromises = [];
          snapshot.forEach((docSnap) => {
            deletePromises.push(deleteDoc(doc(db, "rooms", currentRoomId, "messages", docSnap.id)));
          });
          await Promise.all(deletePromises);
        } catch (err) {
          alert("Failed to clear chat: " + err.message);
        }
      };

      window.handleEnter = function (event) {
        if (event.key === "Enter") window.sendMessage();
      };

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
    </script>
  </body>
</html>
