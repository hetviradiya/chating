<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Room</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --accent: #6366f1;
        --mine: #4f46e5;
        --theirs: #334155;
        --danger: #ef4444;
        --success: #10b981;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        height: 100dvh;
      }
      #app {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* Login Screen */
      #auth-screen {
        margin: auto;
        padding: 24px;
        background: var(--card);
        border-radius: 12px;
        width: 90%;
      }
      h2 {
        margin-bottom: 16px;
        font-size: 1.2rem;
        text-align: center;
      }
      input, select, button {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #0f172a;
        color: white;
        font-size: 1rem;
      }
      button {
        background: var(--accent);
        border: none;
        font-weight: bold;
        cursor: pointer;
      }
      button:active { opacity: 0.9; }

      /* Chat Screen */
      #chat-screen {
        display: none;
        flex-direction: column;
        height: 100%;
      }
      header {
        padding: 12px 16px;
        background: var(--card);
        border-bottom: 1px solid #334155;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-actions {
        display: flex;
        gap: 8px;
      }
      .btn-sm {
        width: auto !important;
        padding: 6px 12px !important;
        font-size: 0.8rem !important;
        margin: 0 !important;
        border-radius: 6px !important;
      }
      .btn-danger { background: var(--danger) !important; color: white !important; }
      .btn-gray { background: #475569 !important; color: white !important; }

      #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 82%;
        padding: 10px 14px;
        border-radius: 14px;
        word-break: break-word;
        font-size: 0.95rem;
      }
      .msg.mine {
        align-self: flex-end;
        background: var(--mine);
        border-bottom-right-radius: 2px;
      }
      .msg.theirs {
        align-self: flex-start;
        background: var(--theirs);
        border-bottom-left-radius: 2px;
      }
      .msg-img {
        max-width: 100%;
        max-height: 250px;
        border-radius: 8px;
        margin-top: 4px;
        display: block;
      }
      .download-btn {
        display: inline-block;
        background: var(--success) !important;
        color: white !important;
        border: none;
        padding: 6px 10px !important;
        border-radius: 6px !important;
        font-size: 0.75rem !important;
        font-weight: bold;
        margin-top: 6px !important;
        cursor: pointer;
        width: auto !important;
      }
      .msg-meta {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }
      .msg-time {
        font-size: 0.7rem;
        opacity: 0.7;
      }
      .del-msg-btn {
        background: #dc2626 !important;
        color: #ffffff !important;
        border: none;
        font-size: 0.7rem !important;
        font-weight: bold;
        cursor: pointer;
        padding: 2px 6px !important;
        border-radius: 4px !important;
        width: auto !important;
        margin: 0 !important;
        display: inline-block !important;
      }

      footer {
        padding: 10px;
        background: var(--card);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      footer input[type="text"] {
        margin: 0;
        flex: 1;
      }
      footer button {
        width: auto;
        padding: 0 16px;
        margin: 0;
        height: 44px;
      }
      .img-upload-label {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #334155;
        border-radius: 8px;
        width: 44px;
        height: 44px;
        cursor: pointer;
        font-size: 1.2rem;
      }
      #file-input {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Login Screen -->
      <div id="auth-screen">
        <h2>Secure Chat Room</h2>
        <label style="font-size: 0.8rem; color: #94a3b8">Who are you?</label>
        <select id="user-select">
          <option value="PartnerA">Partner A</option>
          <option value="PartnerB">Partner B</option>
        </select>
        <label style="font-size: 0.8rem; color: #94a3b8">Shared Secret Passphrase</label>
        <input type="password" id="secret-passphrase" placeholder="e.g. 12345" />
        <button onclick="joinChat()">Enter Secure Chat</button>
      </div>

      <!-- Main Chat Screen -->
      <div id="chat-screen">
        <header>
          <div>
            <strong id="header-user"></strong>
            <span style="font-size: 0.75rem; color: #10b981; margin-left: 6px">● E2EE Active</span>
          </div>
          <div class="header-actions">
            <button class="btn-sm btn-danger" onclick="clearAllChat()">🗑 Clear All</button>
            <button class="btn-sm btn-gray" onclick="location.reload()">Exit</button>
          </div>
        </header>
        <div id="chat-box"></div>
        <footer>
          <label class="img-upload-label" for="file-input" title="Send Image">📷</label>
          <input type="file" id="file-input" accept="image/*" onchange="handleImageUpload(event)" />
          <input
            type="text"
            id="msg-input"
            placeholder="Type a message..."
            onkeypress="handleEnter(event)"
          />
          <button id="send-btn" onclick="sendMessage()">Send</button>
        </footer>
      </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        deleteDoc,
        doc,
        getDocs,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCOJGU8KaKbUrHzzDkH_8sVoiy2spofrmM",
        authDomain: "chating-a20e0.firebaseapp.com",
        projectId: "chating-a20e0",
        storageBucket: "chating-a20e0.firebasestorage.app",
        messagingSenderId: "314695357052",
        appId: "1:314695357052:web:cfb63a5dcb19fa4c7e2ff9",
        measurementId: "G-TFZW77YFWF",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      let currentUser = "";
      let cryptoKey = null;
      let isInitialLoad = true;

      // 3 Days (Images) & 4 Months (Full Chat) in milliseconds
      const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;
      const FOUR_MONTHS_MS = 120 * 24 * 60 * 60 * 1000;

      const chimeSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");

      async function deriveKey(passphrase) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          "raw",
          enc.encode(passphrase),
          "PBKDF2",
          false,
          ["deriveKey"],
        );
        const salt = enc.encode("our-custom-chat-salt-2026");
        return window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: 100000,
            hash: "SHA-256",
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"],
        );
      }

      async function encryptMessage(text, key) {
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const encodedText = new TextEncoder().encode(text);
        const cipherBuffer = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          key,
          encodedText,
        );
        return {
          ciphertext: btoa(String.fromCharCode(...new Uint8Array(cipherBuffer))),
          iv: btoa(String.fromCharCode(...iv)),
        };
      }

      async function decryptMessage(cipherBase64, ivBase64, key) {
        try {
          const cipherBytes = Uint8Array.from(atob(cipherBase64), (c) => c.charCodeAt(0));
          const ivBytes = Uint8Array.from(atob(ivBase64), (c) => c.charCodeAt(0));
          const decryptedBuffer = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: ivBytes },
            key,
            cipherBytes,
          );
          return new TextDecoder().decode(decryptedBuffer);
        } catch {
          return "[Encrypted - Passphrase Mismatch]";
        }
      }

      function triggerNotification(sender, isImage) {
        chimeSound.play().catch(() => {});
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification(sender, {
            body: isImage ? "📷 Sent a photo" : "Sent a new message",
            icon: "https://cdn-icons-png.flaticon.com/512/1041/1041916.png",
          });
        }
      }

      // Auto Purge Cleanup Job (Runs upon entering room)
      async function runAutoPurge() {
        try {
          const now = Date.now();
          const colRef = collection(db, "messages");
          const snapshot = await getDocs(colRef);

          snapshot.forEach(async (docSnap) => {
            const data = docSnap.data();
            const age = now - (data.createdAt || 0);

            // Rule 1: 4 Months old message deleted
            if (age > FOUR_MONTHS_MS) {
              await deleteDoc(doc(db, "messages", docSnap.id));
              return;
            }

            // Rule 2: 3 Days old image deleted
            if (data.type === "image" && age > THREE_DAYS_MS) {
              await deleteDoc(doc(db, "messages", docSnap.id));
            }
          });
        } catch (e) {
          console.warn("Auto purge check finished:", e);
        }
      }

      window.joinChat = async function () {
        const user = document.getElementById("user-select").value;
        const passphrase = document.getElementById("secret-passphrase").value.trim();

        if (!passphrase) {
          alert("Please enter a passphrase.");
          return;
        }

        if ("Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
        }

        currentUser = user;
        try {
          cryptoKey = await deriveKey(passphrase);
        } catch (e) {
          alert("Key error: " + e.message);
          return;
        }

        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "flex";
        document.getElementById("header-user").textContent = currentUser;

        runAutoPurge();
        listenToMessages();
      };

      function listenToMessages() {
        const colRef = collection(db, "messages");
        const chatBox = document.getElementById("chat-box");

        onSnapshot(colRef, async (snapshot) => {
          let messages = [];
          snapshot.forEach((docSnap) => {
            messages.push({ id: docSnap.id, ...docSnap.data() });
          });

          messages.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

          chatBox.innerHTML = "";
          for (const data of messages) {
            const plainText = await decryptMessage(data.ciphertext, data.iv, cryptoKey);
            const isMine = data.sender === currentUser;

            const msgEl = document.createElement("div");
            msgEl.className = `msg ${isMine ? "mine" : "theirs"}`;

            const timeStr = data.createdAt
              ? new Date(data.createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
              : "just now";

            const deleteActionHtml = isMine
              ? `<button class="del-msg-btn" onclick="deleteSingleMessage('${data.id}')">Delete</button>`
              : "";

            let contentHtml = "";
            if (data.type === "image") {
              contentHtml = `
                <img src="${plainText}" class="msg-img" alt="Shared photo" />
                <div>
                  <button class="download-btn" onclick="downloadAndDelete('${data.id}', '${plainText}')">
                    ⬇ Download & Delete
                  </button>
                </div>
              `;
            } else {
              contentHtml = `<div>${escapeHtml(plainText)}</div>`;
            }

            msgEl.innerHTML = `
              ${contentHtml}
              <div class="msg-meta">
                <span class="msg-time">${timeStr}</span>
                ${deleteActionHtml}
              </div>
            `;
            chatBox.appendChild(msgEl);
          }

          chatBox.scrollTop = chatBox.scrollHeight;

          if (!isInitialLoad && snapshot.docChanges().some(c => c.type === "added" && c.doc.data().sender !== currentUser)) {
            const latest = messages[messages.length - 1];
            if (latest && latest.sender !== currentUser) {
              triggerNotification(latest.sender, latest.type === "image");
            }
          }

          isInitialLoad = false;
        });
      }

      window.sendMessage = async function () {
        const input = document.getElementById("msg-input");
        const text = input.value.trim();
        if (!text || !cryptoKey) return;

        input.value = "";
        try {
          const { ciphertext, iv } = await encryptMessage(text, cryptoKey);
          await addDoc(collection(db, "messages"), {
            sender: currentUser,
            type: "text",
            ciphertext: ciphertext,
            iv: iv,
            createdAt: Date.now(),
          });
        } catch (error) {
          alert("Could not send: " + error.message);
        }
      };

      // Upload High-Quality Original Photo with Smart Optimization
      window.handleImageUpload = async function (e) {
        const file = e.target.files[0];
        if (!file || !cryptoKey) return;

        const sendBtn = document.getElementById("send-btn");
        sendBtn.disabled = true;
        sendBtn.textContent = "⏳...";

        try {
          // Optimized for full screen resolution without breaking 1MB Firestore limit
          const base64Data = await readImageAsOptimizedDataURL(file);
          const { ciphertext, iv } = await encryptMessage(base64Data, cryptoKey);

          await addDoc(collection(db, "messages"), {
            sender: currentUser,
            type: "image",
            ciphertext: ciphertext,
            iv: iv,
            createdAt: Date.now(),
          });
        } catch (err) {
          alert("Image send failed: " + err.message);
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = "Send";
          e.target.value = "";
        }
      };

      // Download photo to local storage & immediately delete from cloud
      window.downloadAndDelete = async function (docId, base64Url) {
        try {
          // Trigger browser file download
          const link = document.createElement("a");
          link.href = base64Url;
          link.download = `photo_${Date.now()}.jpg`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          // Delete from Firestore immediately
          await deleteDoc(doc(db, "messages", docId));
        } catch (err) {
          alert("Download/Delete error: " + err.message);
        }
      };

      function readImageAsOptimizedDataURL(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              const maxDim = 1280; // Crisp full-screen mobile/desktop clarity
              let width = img.width;
              let height = img.height;

              if (width > height && width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }

              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              resolve(canvas.toDataURL("image/jpeg", 0.8));
            };
            img.onerror = reject;
          };
          reader.onerror = reject;
        });
      }

      window.deleteSingleMessage = async function (messageId) {
        if (!confirm("Delete this message?")) return;
        try {
          await deleteDoc(doc(db, "messages", messageId));
        } catch (err) {
          alert("Failed to delete: " + err.message);
        }
      };

      window.clearAllChat = async function () {
        if (!confirm("Are you sure you want to delete ALL messages in the chat?")) return;
        try {
          const colRef = collection(db, "messages");
          const snapshot = await getDocs(colRef);
          const deletePromises = [];
          snapshot.forEach((docSnap) => {
            deletePromises.push(deleteDoc(doc(db, "messages", docSnap.id)));
          });
          await Promise.all(deletePromises);
        } catch (err) {
          alert("Failed to clear chat: " + err.message);
        }
      };

      window.handleEnter = function (event) {
        if (event.key === "Enter") window.sendMessage();
      };

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
    </script>
  </body>
</html>
